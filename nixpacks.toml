[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.tokenizer",
  "php83Extensions.xml",
  "php83Extensions.ctype",
  "php83Extensions.json",
  "php83Extensions.bcmath",
  "php83Extensions.fileinfo",
  "php83Extensions.curl",
  "php83Extensions.openssl"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-scripts",
  "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache",
  "chmod -R 777 storage bootstrap/cache"
]

# DO NOT cache config here — env vars not available at build time
[phases.build]
cmds = []

[start]
cmd = "php artisan config:clear && php artisan cache:clear && php artisan route:clear && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"
