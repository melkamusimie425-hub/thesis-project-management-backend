[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.tokenizer",
  "php83Extensions.xml",
  "php83Extensions.ctype",
  "php83Extensions.json",
  "php83Extensions.bcmath",
  "php83Extensions.fileinfo",
  "php83Extensions.curl",
  "php83Extensions.openssl",
  "php83Extensions.gd"
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
  "php artisan config:clear",
  "php artisan route:cache",
  "php artisan migrate --force",
  "php artisan db:seed --force"
]

[start]
cmd = "php artisan config:clear && php artisan serve --host=0.0.0.0 --port=$PORT"
