services:
  - type: web
    name: otpms-backend
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "OTPMS - Wolaita Sodo University"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: FRONTEND_URL
        value: https://thesis-project-management-frontend.vercel.app
      - key: SANCTUM_STATEFUL_DOMAINS
        value: thesis-project-management-frontend.vercel.app
      - key: APP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: otpms-db
          property: connectionString

databases:
  - name: otpms-db
    plan: free
    region: oregon
    databaseName: otpms_db
    user: otpms_user
